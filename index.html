<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чакыруу Түзүү</title>
    <style>
        /* ================= ЖАЛПЫ КӨРҮНҮШ ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf9f2;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        h2, h3 {
            color: #5a3e2b;
            margin-top: 0;
            font-size: 18px;
        }
        h3 {
            border-bottom: 2px solid #f0e6d2;
            padding-bottom: 8px;
            margin-top: 25px;
        }

        /* ================= ФОРМА ЭЛЕМЕНТТЕРИ ================= */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4a3b2b;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0d6c8;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
            color: #333;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #8b5a2b;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ================= БАСКЫЧТАР ================= */
        .btn {
            width: 100%;
            padding: 15px;
            background-color: #8b5a2b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background-color: #6b4423;
        }
        .btn-outline {
            background-color: #fff;
            color: #8b5a2b;
            border: 2px solid #8b5a2b;
        }
        .btn-outline:hover {
            background-color: #fdf5e6;
        }
        .btn-whatsapp {
            background-color: #25D366;
            padding: 8px 15px;
            width: auto;
            font-size: 14px;
            margin-top: 5px;
            border-radius: 20px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }

        /* ================= МААЛЫМАТ КОРУТУНДУСУ ================= */
        .info-box {
            background-color: #f5efe6;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #8b5a2b;
        }
        .info-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #4a3b2b;
        }
        .info-box strong {
            color: #8b5a2b;
            font-size: 16px;
        }

        /* ================= ТЕКШЕРҮҮ ШИЛТЕМЕСИ ================= */
        .link-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .link-box input {
            flex-grow: 1;
            background-color: #f9f9f9;
            color: #666;
        }
        .link-box button {
            width: auto;
            padding: 0 20px;
            margin-top: 0;
        }

        /* ================= КОНОКТОРДУН ТИЗМЕСИ ================= */
        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .guest-item span {
            font-weight: 500;
            color: #333;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1-БӨЛҮК: НЕГИЗГИ МААЛЫМАТ ЖАНА ТӨЛӨМ -->
    <h2>Чакыруу түзүү</h2>
    
    <div class="info-box">
        <p>💰 <strong>60 000 сом</strong></p>
        <p>💳 mBank: <strong>0556 652 652</strong></p>
        <p>Төлөөдөн кийин чакыруу даяр болот.</p>
    </div>

    <div class="form-group">
        <label>Ээсинин сырсөзү (өзүңүз үчүн акысыз)</label>
        <input type="password" id="ownerPassword" placeholder="••••••••">
    </div>

    <button class="btn" onclick="generateInvitation()">Чакыруу даяр ✔ (акысыз)</button>

    <!-- 2-БӨЛҮК: ТЕКШЕРҮҮ ШИЛТЕМЕСИ -->
    <div id="linkSection" class="hidden" style="margin-top: 20px;">
        <h3>Текшерүү шилтемеси</h3>
        <div class="link-box">
            <input type="text" id="generatedLink" readonly value="about:srcdoc#v=...">
            <button class="btn btn-outline" onclick="previewLink()">Ачып көрүү</button>
        </div>
    </div>

    <!-- 3-БӨЛҮК: КОНОКТОРДУН ТИЗМЕСИ ЖАНА WHATSAPP -->
    <div id="guestSection" class="hidden" style="margin-top: 25px;">
        <h3>Конокторду жазыңыз (ар бир сапка бир ат)</h3>
        <div class="form-group">
            <textarea id="guestNames" placeholder="Мисалы:&#10;Азамат&#10;Айгүл&#10;Нурлан"></textarea>
        </div>

        <button class="btn btn-outline" onclick="generateGuestLinks()">Жеке шилтемелерди жаса</button>

        <div id="guestListContainer" style="margin-top: 15px;">
            <!-- Коноктордун тизмеси ушул жерге келет -->
        </div>
    </div>
</div>

<script>
    // ================= 1. ЧАКЫРУУНУ ДАЯРДОО =================
    function generateInvitation() {
        const password = document.getElementById('ownerPassword').value;
        
        // Сырсөздү текшерүү (Мисал үчүн, каалаган сырсөздү киргизсеңиз болот)
        // Эскертүү: Чыныгы тиркемеде бул серверде текшерилиши керек.
        // Азырынча биз аны жөн эле "1234" же бош эмес деп текшеребиз.
        if (!password) {
            alert("Сураныч, сырсөздү киргизиңиз!");
            return;
        }

        // Шилтеме бөлүмүн жана Коноктор бөлүмүн көрсөтөбүз
        document.getElementById('linkSection').classList.remove('hidden');
        document.getElementById('guestSection').classList.remove('hidden');

        // Текшерүү шилтемесин түзөбүз (Бул жерде жөнөкөй уникалдуу шилтеме)
        const uniqueId = Date.now().toString(36) + Math.random().toString(36).substr(2);
        const linkInput = document.getElementById('generatedLink');
        linkInput.value = window.location.href.split('#')[0] + "#v=" + uniqueId;

        // Баскычтын текстин өзгөртөбүз
        const btn = document.querySelector('.btn');
        btn.innerHTML = "✔ Чакыруу даяр (акысыз)";
        btn.style.backgroundColor = "#27ae60"; // Жашыл түс
    }

    // ================= 2. ШИЛТЕМЕНИ АЧЫП КӨРҮҮ =================
    function previewLink() {
        const link = document.getElementById('generatedLink').value;
        if (link) {
            // Жаңы терезеде ачуу
            window.open(link, '_blank');
        }
    }

    // ================= 3. КОНОКТОР ҮЧҮН ЖЕКЕ ШИЛТЕМЕЛЕРДИ ЖАСОО =================
    function generateGuestLinks() {
        const input = document.getElementById('guestNames').value;
        const container = document.getElementById('guestListContainer');
        container.innerHTML = ''; // Мурункуларды тазалайбыз

        if (!input.trim()) {
            alert("Сураныч, коноктордун аттарын жазыңыз!");
            return;
        }

        // Ар бир сапты бөлүп, массив кылабыз
        const guests = input.split('\n').filter(name => name.trim() !== '');

        guests.forEach((guest, index) => {
            const guestName = guest.trim();
            
            // WhatsApp шилтемесин түзөбүз
            // Эскертүү: Бул жерде сиздин WhatsApp номериңизди киргизиңиз
            const myWhatsAppNumber = "996556652652"; // Сиздин номериңиз
            const message = `Салам, ${guestName}! Сизди тойго чакырабыз. Толук маалымат үчүн шилтемени басыңыз: `;
            const invitationLink = document.getElementById('generatedLink').value;
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message + invitationLink)}`;

            // Ар бир конок үчүн HTML түзөбүз
            const guestDiv = document.createElement('div');
            guestDiv.className = 'guest-item';
            guestDiv.innerHTML = `
                <span>${guestName}</span>
                <a href="${whatsappUrl}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>
            `;
            container.appendChild(guestDiv);
        });
    }
</script>

</body>
</html>
