<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILATA INVITE</title>
    <style>
        /* ================= ЖАЛПЫ КӨРҮНҮШ ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf9f2; /* Сүрөттөгүдөй крем түс */
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* ================= БАШКЫ БЕТ (ШАБЛОН ТАНДОО) ================= */
        h1 {
            text-align: center;
            font-size: 22px;
            color: #5a3e2b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
        }
        
        /* Шаблондордун тизмеси (горизонталдуу сыдырма) */
        .template-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            scrollbar-width: thin;
        }
        .template-card {
            min-width: 140px;
            height: 200px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            position: relative;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .template-card.selected {
            border-color: #8b5a2b; /* Тандалганда күрөң жээк */
        }
        .template-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.4);
            color: white;
            padding: 10px;
            font-size: 12px;
            text-align: center;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        
        .btn-next {
            width: 100%;
            padding: 15px;
            background-color: #8b5a2b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-next:hover { background-color: #6b4423; }

        /* ================= АДМИН ПАНЕЛЬ ================= */
        .admin-toggle {
            text-align: right;
            font-size: 14px;
            color: #8b5a2b;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .admin-panel {
            display: none; /* Жашыруун турат */
            background: #1e1e1e;
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #8b5a2b;
        }
        .admin-panel h3 {
            color: #f1c40f;
            text-align: center;
            margin-top: 0;
        }
        .admin-panel label {
            color: #ddd;
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }
        .admin-panel input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-save:hover { background: #219150; }

        /* Админ тизмесиндеги шаблондор */
        .admin-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .admin-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 10px;
        }
        .admin-item-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        .admin-item-info h4 { margin: 0; font-size: 14px; color: #fff; }
        .admin-item-info p { margin: 0; font-size: 12px; color: #f1c40f; }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-delete:hover { background: #c0392b; }

        /* Жашыруу классы */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- Админ кирүү баскычы -->
    <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Админ</div>

    <!-- БАШКЫ БЕТ -->
    <div id="mainPage">
        <h1>Негизги маалымат</h1>
        
        <div class="form-group">
            <label>Той түрү</label>
            <select id="weddingType">
                <option>Үйлөнүү той</option>
                <option>Кыз узатуу</option>
                <option>Туулган күн</option>
            </select>
        </div>

        <div class="form-group">
            <label>Той ээлеринин аты-жөнү</label>
            <input type="text" id="coupleNames" placeholder="Тилек & Айгүл" value="Тилек & Айгүл">
        </div>

        <div class="form-group">
            <label>WhatsApp номериңиз (жооптор ушуга келет)</label>
            <input type="tel" id="whatsappNumber" placeholder="996556652652" value="996556652652">
        </div>

        <div class="form-group">
            <label>Шаблон</label>
            <div class="template-scroll" id="templateContainer">
                <!-- JavaScript аркылуу шаблондор бул жерге келет -->
            </div>
        </div>

        <button class="btn-next" onclick="submitInvitation()">Кийинки</button>
    </div>

    <!-- АДМИН ПАНЕЛИ -->
    <div id="adminPanel" class="admin-panel">
        <h3>⚙️ Админ панели</h3>
        
        <label>Шаблондун аты:</label>
        <input type="text" id="adminName" placeholder="Мисалы: Ggg">

        <label>Баасы (сом):</label>
        <input type="number" id="adminPrice" placeholder="990">

        <label>Фон сүрөтү:</label>
        <input type="file" id="adminImage" accept="image/*">

        <button class="btn-save" onclick="addTemplate()">+ Жаңы шаблон кошуу</button>

        <h3 style="margin-top: 20px;">Бар болгон шаблондор</h3>
        <div class="admin-list" id="adminList">
            <!-- Админ тизмеси ушул жерге келет -->
        </div>
        
        <button class="btn-save" style="background:#e74c3c; margin-top:20px;" onclick="toggleAdmin()">Артка</button>
    </div>
</div>

<script>
    // ================= БАШКЫ ЛОГИКА =================
    
    // 1. Шаблондорду эстутумдан жүктөө (эгер жок болсо, демейки шаблон кошулат)
    let templates = JSON.parse(localStorage.getItem('tilataTemplates')) || [
        { id: 1, name: 'Классика', price: 990, image: 'https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
        { id: 2, name: 'Романтика', price: 1200, image: 'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' }
    ];

    // Тандалган шаблондун ID'си
    let selectedTemplateId = null;

    // 2. Барак ачылганда иштөөчү функция
    document.addEventListener('DOMContentLoaded', () => {
        renderTemplates();
        renderAdminList();
    });

    // 3. Башкы беттеги шаблондорду чыгаруу
    function renderTemplates() {
        const container = document.getElementById('templateContainer');
        container.innerHTML = '';

        if (templates.length === 0) {
            container.innerHTML = '<p style="color:gray; font-size:14px;">Шаблон жок. Админден кошуңуз.</p>';
            return;
        }

        templates.forEach(tpl => {
            const card = document.createElement('div');
            card.className = `template-card ${selectedTemplateId === tpl.id ? 'selected' : ''}`;
            card.style.backgroundImage = `url('${tpl.image}')`;
            
            card.onclick = () => {
                selectedTemplateId = tpl.id;
                renderTemplates(); // Кайра чийип, тандалганын көрсөтөбүз
            };

            card.innerHTML = `
                <div class="overlay">${tpl.name} - ${tpl.price} сом</div>
            `;
            container.appendChild(card);
        });
    }

    // 4. Админ тизмесин чыгаруу
    function renderAdminList() {
        const adminList = document.getElementById('adminList');
        adminList.innerHTML = '';

        if (templates.length === 0) {
            adminList.innerHTML = '<p style="color:gray; text-align:center;">Тизме бош</p>';
            return;
        }

        templates.forEach(tpl => {
            const item = document.createElement('div');
            item.className = 'admin-item';
            item.innerHTML = `
                <div class="admin-item-info">
                    <img src="${tpl.image}" alt="img">
                    <div>
                        <h4>${tpl.name}</h4>
                        <p>${tpl.price} сом</p>
                    </div>
                </div>
                <button class="btn-delete" onclick="deleteTemplate(${tpl.id})">🗑️</button>
            `;
            adminList.appendChild(item);
        });
    }

    // 5. Жаңы шаблон кошуу (Админ)
    function addTemplate() {
        const name = document.getElementById('adminName').value;
        const price = document.getElementById('adminPrice').value;
        const fileInput = document.getElementById('adminImage');

        if (!name || !price || fileInput.files.length === 0) {
            alert("Сураныч, бардык талааларды толтуруңуз жана сүрөт тандаңыз!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const newTemplate = {
                id: Date.now(), // Уникалдуу ID
                name: name,
                price: price,
                image: e.target.result // Сүрөттүн Base64 көрүнүшү
            };

            templates.push(newTemplate);
            saveData();
            
            // Форманы тазалоо
            document.getElementById('adminName').value = '';
            document.getElementById('adminPrice').value = '';
            document.getElementById('adminImage').value = '';

            renderTemplates();
            renderAdminList();
            alert("Шаблон ийгиликтүү кошулду!");
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    // 6. Шаблонду өчүрүү
    function deleteTemplate(id) {
        if (confirm("Бул шаблонду чын эле өчүрөсүзбү?")) {
            templates = templates.filter(tpl => tpl.id !== id);
            if (selectedTemplateId === id) selectedTemplateId = null; // Эгер тандалган болсо, аны тазалайбыз
            
            saveData();
            renderTemplates();
            renderAdminList();
        }
    }

    // 7. Маалыматты браузердин эстутумуна сактоо
    function saveData() {
        localStorage.setItem('tilataTemplates', JSON.stringify(templates));
    }

    // 8. Админ панелин ачуу/жабуу
    function toggleAdmin() {
        const mainPage = document.getElementById('mainPage');
        const adminPanel = document.getElementById('adminPanel');

        if (adminPanel.style.display === 'block') {
            adminPanel.style.display = 'none';
            mainPage.style.display = 'block';
            // Башкы бетке кайтканда тизмени жаңыртабыз
            renderTemplates();
        } else {
            adminPanel.style.display = 'block';
            mainPage.style.display = 'none';
        }
    }

    // 9. "Кийинки" баскычы басылганда
    function submitInvitation() {
        if (!selectedTemplateId) {
            alert("Сураныч, шаблон тандаңыз!");
            return;
        }
        
        const type = document.getElementById('weddingType').value;
        const names = document.getElementById('coupleNames').value;
        const phone = document.getElementById('whatsappNumber').value;
        const selectedTpl = templates.find(t => t.id === selectedTemplateId);

        alert(`Чакыруу түзүлдү!\n\nТой түрү: ${type}\nЭэлери: ${names}\nWhatsApp: ${phone}\nТандалган шаблон: ${selectedTpl.name} (${selectedTpl.price} сом)`);
        
        // Бул жерде сиз кийинки бетке өтүү логикасын жаза аласыз
    }
</script>

</body>
</html>
